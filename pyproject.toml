[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps9-workflow-anomaly"
version = "0.1.0"
description = "Anomaly Detection in Process Workflows Using Automata and Machine Learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TOC Project Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
]
dashboard = [
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "graphviz>=0.20.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP006", "UP035", "UP042", "UP045", "UP017"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"src/db/migrations/*" = ["E402"]
"src/dashboard/*" = ["E402"]
"src/dashboard/pages/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/dashboard/*",
]
